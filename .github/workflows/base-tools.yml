name: Install base tools
on:
  push:
    paths: [.config/mise/conf.d/chrono-harness.toml, .github/workflows/base-tools.yml]
  pull_request:
    paths: [.config/mise/conf.d/chrono-harness.toml, .github/workflows/base-tools.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78
        with:
          version: 2026.11.12
          cache: false
      - name: Run the installed commands
        shell: bash
        run: |
          set -euo pipefail
          mise ls --current
          verus --version
          chrono-pr pr-reminders
          mise run harness-setup
          git diff --exit-code -- CLAUDE.md .chrono-harness/instructions
          test -f .chrono-harness/instructions/manifest.json
          test "$(readlink AGENTS.md)" = CLAUDE.md
