_min_copier_version: "9.4.0"
_subdirectory: scaffold
_preserve_symlinks: true
_skip_if_exists: [.chrono-harness/rules.json]
_answers_file: .chrono-harness/template-answers.yml
features:
  type: str
  multiselect: true
  help: 默认安装全部工具。按空格取消本仓不需要的工具，回车确认。
  default: &available_tools
    - cache
    - ci
    - distribution
    - harness
    - host-bootstrap
    - host-release
    - inputs
    - instructions
    - judge-ci
    - judge-cost
    - judge-filemap
    - judge-mixed
    - judge-projects
    - registration
    - judge-routes
    - judge-workflow
    - pr
    - worktree
    - verus
  choices: *available_tools
project_guide:
  type: str
  multiline: true
  default: ""
  help: 本仓职责、源码位置和验证入口（可选，可直接在根指南追加）。
generate_check:
  type: bool
  default: false
  help: 是否为业务检查生成本地命令和 GitHub Actions？已有检查入口的仓库可以保留自己的工作流。
check_command:
  type: str
  when: "{{ generate_check }}"
  default: ./check.sh
  help: 仓库已有的业务检查命令
  validator: "{% if not check_command.strip() %}请输入业务检查命令{% endif %}"
repository:
  type: str
  default: ""
  help: GitHub 仓库 owner/name（选用 pr 时必填，其他仓库可以留空）
  validator: "{% if ('pr' in features or repository) and not (repository | regex_search('^[A-Za-z0-9][A-Za-z0-9_.-]*/[A-Za-z0-9][A-Za-z0-9_.-]*$')) %}请输入 owner/name{% endif %}"
dev_branch:
  type: str
  default: dev
  help: 开发分支。正式版使用 main。
required_check:
  type: str
  when: "{{ 'pr' in features }}"
  default: check
  help: PR 状态需要核对的 GitHub 检查名
check_os:
  type: str
  when: "{{ generate_check }}"
  help: 业务检查在哪个平台执行？
  default: ubuntu-24.04
  choices: [ubuntu-24.04, macos-15]
